name: Documentation or design question
description: Something in the design is unclear, missing, or you think it is wrong.
labels: ["docs"]
body:
  - type: input
    id: where
    attributes:
      label: Which file?
      placeholder: docs/coherence.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear, missing, or wrong?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: If you think a decision is wrong, what changed in the world?
      description: The alternatives were in view when it was decided, so new evidence is what moves it.
